<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سكينة</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سكينة">
<meta name="theme-color" content="#0f5c4a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5efe3; --card:#fffdf8; --ink:#1b2a26; --muted:#6b7a74; --line:#e4dccb;
  --green:#0f5c4a; --green-2:#17745e; --gold:#b3862f; --gold-soft:#f3e7cc; --on-green:#fdf8ec;
  --ar: "Geeza Pro","SF Arabic","Damascus","Noto Naskh Arabic","Amiri",serif;
  --ui: -apple-system,"SF Pro Text","SF Arabic","Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1a17; --card:#14261f; --ink:#ecebe2; --muted:#93a39c; --line:#22382f;
    --green:#0f5c4a; --green-2:#1c8a70; --gold:#d8ad55; --gold-soft:#2a3326; --on-green:#fdf8ec;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
header{background:linear-gradient(160deg,var(--green),#0b4537);color:var(--on-green);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:170px;height:170px;border-radius:50%;
  border:26px solid rgba(255,255,255,.06)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.brand{font-size:24px;font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:2px}
.lang{background:rgba(255,255,255,.14);border:0;color:var(--on-green);padding:8px 13px;border-radius:999px;font-weight:700;font-size:13px}
main{flex:1;padding:16px 16px 110px;max-width:640px;width:100%;margin:0 auto}
h2{font-size:15px;margin:22px 4px 10px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px}
.next b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--green-2)}
.next .lbl{color:var(--muted);font-size:13px}
.next .nm{font-size:20px;font-weight:800;margin-top:2px}
.pill{display:inline-block;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:999px}
.father{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card) 70%)}
.dua{font-family:var(--ar);font-size:23px;line-height:2.05;margin:10px 0 6px;text-align:center;direction:rtl}
.tr{color:var(--muted);font-size:14.5px;line-height:1.55;text-align:center;direction:ltr}
.src{color:var(--gold);font-size:12.5px;text-align:center;margin-top:8px;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;
  background:var(--green);color:var(--on-green);margin-top:12px}
.btn.ghost{background:transparent;color:var(--green-2);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#1d1503}
.btn:active{transform:scale(.985)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:start}
.tile .ic{font-size:26px}
.tile .t{font-weight:800;font-size:16.5px;margin-top:8px}
.tile .s{color:var(--muted);font-size:12.5px;margin-top:3px}
.zk{position:relative;transition:opacity .2s}
.zk.done{opacity:.45}
.zk .cnt{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.zk .num{font-weight:800;font-size:17px;color:var(--green-2);font-variant-numeric:tabular-nums}
.zk .tap{font-size:12.5px;color:var(--muted)}
.back{background:none;border:0;color:var(--green-2);font-weight:800;font-size:15px;padding:6px 2px;margin-bottom:6px}
.ring{width:230px;height:230px;border-radius:50%;margin:18px auto 10px;border:0;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,var(--green-2),var(--green) 70%);color:var(--on-green);
  box-shadow:0 14px 34px rgba(15,92,74,.35),inset 0 0 0 8px rgba(255,255,255,.08)}
.ring b{font-size:68px;font-variant-numeric:tabular-nums;line-height:1}
.ring span{display:block;font-size:13px;opacity:.8;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-family:var(--ar);font-size:16px}
.chip.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:17px}
.row:last-child{border-bottom:0}
.row.on{color:var(--green-2);font-weight:800}
.row time{font-variant-numeric:tabular-nums;font-weight:700}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:600}
.in{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 2px}
.sw input{width:22px;height:22px;accent-color:var(--green)}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:10px 2px 0}
.compass{width:220px;height:220px;border-radius:50%;margin:14px auto;border:2px solid var(--line);position:relative;background:var(--bg)}
.compass i{position:absolute;inset:0;display:grid;place-items:start center;font-style:normal;padding-top:8px;font-size:12px;color:var(--muted);font-weight:700}
.needle{position:absolute;inset:0;transition:transform .15s linear}
.needle::before{content:"🕋";position:absolute;left:50%;top:26px;transform:translateX(-50%);font-size:28px}
.needle::after{content:"";position:absolute;left:50%;top:66px;width:4px;height:46px;margin-left:-2px;border-radius:4px;background:var(--gold)}
.dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--green-2)}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
nav button{background:none;border:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
nav button span{font-size:22px;filter:grayscale(.6);opacity:.75}
nav button.on{color:var(--green-2)}
nav button.on span{filter:none;opacity:1}
.modal{position:fixed;inset:0;background:rgba(6,20,16,.62);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;
  padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .28s ease-out}
.sheet h3{margin:0;text-align:center;font-size:20px}
.sheet p.sub{text-align:center;color:var(--muted);margin:6px 0 0;font-size:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--green);color:var(--on-green)}
.ctl{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.ctl .btn{margin:0;flex:1;padding:14px 8px}
.cbtn{width:92px;height:92px;flex:none;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,var(--green-2),var(--green) 70%);color:var(--on-green);
  box-shadow:0 10px 24px rgba(15,92,74,.35),inset 0 0 0 6px rgba(255,255,255,.08)}
.cbtn b{font-size:34px;font-variant-numeric:tabular-nums}
.cbtn.ok{background:var(--gold);color:#1d1503}
.cbtn:active{transform:scale(.95)}
textarea.in{font-family:var(--ar);font-size:19px;line-height:1.8;resize:vertical}
.del{position:absolute;top:8px;inset-inline-end:10px;border:0;background:none;color:var(--muted);font-size:18px;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span id="bName">سكينة</span><small id="hDate"></small></div>
    <button class="lang" id="langBtn">EN</button>
  </div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-v="home"><span>🏠</span><em style="font-style:normal" data-i="tHome"></em></button>
  <button data-v="azkar"><span>📿</span><em style="font-style:normal" data-i="tAzkar"></em></button>
  <button data-v="tasbih"><span>🔢</span><em style="font-style:normal" data-i="tTasbih"></em></button>
  <button data-v="prayer"><span>🕌</span><em style="font-style:normal" data-i="tPrayer"></em></button>
  <button data-v="father"><span>🤲</span><em style="font-style:normal" data-i="tFather"></em></button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('sk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sk_'+k,JSON.stringify(v))}catch(e){}}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

/* ---------- text ---------- */
const T={
ar:{app:'سكينة',tHome:'الرئيسية',tAzkar:'الأذكار',tTasbih:'التسبيح',tPrayer:'الصلاة',tFather:'الوالد',
  next:'الصلاة القادمة',after:'بعد',fatherCard:'دعاء للوالد رحمه الله',fatherFor:'دعاء لوالدي',prayed:'آمين — دعوتُ له',
  prayedToday:'دعوتَ له اليوم ✓ — ادعُ مرة أخرى',later:'لاحقًا',another:'دعاء آخر',sections:'الأذكار اليومية',
  morning:'أذكار الصباح',evening:'أذكار المساء',sleep:'أذكار النوم',afterp:'أذكار بعد الصلاة',
  items:'ذكر',tapCount:'اضغط للعدّ',reset:'إعادة العدّ',back:'‹ رجوع',total:'المجموع',target:'الهدف',

  qibla:'اتجاه القبلة',qDeg:'درجة من الشمال',compassOn:'🧭 تشغيل البوصلة',compassNo:'البوصلة غير متاحة على هذا الجهاز. استخدم الدرجة أعلاه مع تطبيق البوصلة.',
  locErr:'تعذّر الحصول على الموقع — تم استخدام المدينة المحددة.',approx:'الأوقات محسوبة فلكيًا وقد تختلف دقيقة أو دقيقتين عن التقويم الرسمي.',
  fajr:'الفجر',sunrise:'الشروق',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء',
  fName:'اسم الوالد (اختياري)',fNamePh:'مثال: سالم',fCount:'عدد المرات التي دعوتَ له',fDuas:'أدعية للوالد المتوفى',
  rem:'التذكير',remIn:'ذكّرني بالدعاء عند فتح التطبيق',freq:'التكرار',fDaily:'كل يوم',fFri:'كل جمعة',fOpen:'كل مرة أفتح التطبيق',
  remTime:'وقت التنبيه',addCal:'🔔 أضف تنبيهًا متكررًا إلى التقويم',
  calNote:'هذا الزر ينشئ موعدًا متكررًا في تقويم الآيفون مع تنبيه، فيصلك الإشعار حتى لو كان التطبيق مغلقًا.',
  hadith:'قال ﷺ: «إذا مات الإنسان انقطع عمله إلا من ثلاث… أو ولدٍ صالحٍ يدعو له» — رواه مسلم',
  mTitle:'لا تنسَ والدك من دعائك',mSub:'دعوة صادقة تصله بإذن الله',calTitle:'الدعاء للوالد',general:'دعاء عام',waking:'أذكار الاستيقاظ',duas:'أدعية جامعة',kursi:'آية الكرسي',mine:'أذكاري',ayah:'آية اليوم',tRead:'الذكر',prev:'السابق',nextZ:'التالي',showAll:'عرض كل الأذكار',oneByOne:'عرض ذكر واحد',days:'أيام التذكير',itsTime:'حان الآن وقت',quranOnline:'سور (تفتح في quran.com)',empty:'لا توجد أذكار بعد — أضف ذكرك الأول.',mText:'نص الذكر',mCount:'عدد التكرار',mAdd:'＋ إضافة إلى أذكاري'},

  prayedToday:'Prayed today ✓ — pray again',later:'Later',another:'Another dua',sections:'Daily azkar',
  morning:'Morning azkar',evening:'Evening azkar',sleep:'Before sleep',afterp:'After prayer',
  items:'items',tapCount:'Tap to count',reset:'Reset count',back:'‹ Back',total:'Total',target:'Target',
  times:'Prayer times',loc:'Location',useLoc:'📍 Use my current location',city:'City',method:'Calculation method',
  qibla:'Qibla direction',qDeg:'degrees from North',compassOn:'🧭 Turn on compass',compassNo:'Compass is not available on this device. Use the bearing above with the Compass app.',

  fajr:'Fajr',sunrise:'Sunrise',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha',
  fName:"Father's name (optional)",fNamePh:'e.g. Salim',fCount:'Times you have prayed for him',fDuas:'Duas for a deceased father',
  rem:'Reminder',remIn:'Prompt me to pray when I open the app',freq:'How often',fDaily:'Every day',fFri:'Every Friday',fOpen:'Every time I open the app',

};
let lang=store.get('lang','ar');
const t=k=>T[lang][k]??k;

/* ---------- content ---------- */
const KURSI={ar:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',
  en:'Ayat al-Kursi — the Verse of the Throne.',src:'البقرة 255',n:1};
const QULS={ar:'سورة الإخلاص، وسورة الفلق، وسورة الناس',en:'Recite Surah Al-Ikhlas, Al-Falaq and An-Nas.',src:'أبو داود والترمذي',n:3};
const BISM={ar:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
  en:'In the name of Allah, with whose name nothing on earth or in heaven can cause harm; He is the All-Hearing, the All-Knowing.',src:'أبو داود والترمذي',n:3};
const RADITU={ar:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا',
  en:'I am pleased with Allah as Lord, Islam as religion, and Muhammad ﷺ as Prophet.',src:'أبو داود والترمذي',n:3};
const ISTIGHFAR={ar:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
  en:'Sayyid al-Istighfar — the master supplication for forgiveness.',src:'البخاري',n:1};
const HASBI={ar:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',
  en:'Allah is sufficient for me; there is no god but Him. In Him I trust, and He is Lord of the Mighty Throne.',src:'أبو داود',n:7};
const AFINI={ar:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',
  en:'O Allah, grant me health in my body, my hearing and my sight. There is no god but You.',src:'أبو داود',n:3};
const SUBHAN100={ar:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',en:'Glory and praise be to Allah.',src:'مسلم',n:100};
const TAHLIL=n=>({ar:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
  en:'There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things.',src:'متفق عليه',n});

/* ---------- calculations ---------- */
//CALC-START
const R=Math.PI/180;
const dsin=d=>Math.sin(d*R),dcos=d=>Math.cos(d*R),dtan=d=>Math.tan(d*R);
const dasin=x=>Math.asin(x)/R,dacos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,datan2=(y,x)=>Math.atan2(y,x)/R;
const fix=(a,m)=>{a=a-m*Math.floor(a/m);return a<0?a+m:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sun(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
  L=fix(q+1.915*dsin(g)+0.020*dsin(2*g),360),e=23.439-0.00000036*D,
  RA=fix(datan2(dcos(e)*dsin(L),dcos(L))/15,24);
  return{decl:dasin(dsin(e)*dsin(L)),eqt:q/15-RA}}
function prayerTimes(date,lat,lng,tz,fajrAng,ishaSpec){
  const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const sp=h=>sun(jd+h/24);
  const mid=h=>fix(12-sp(h).eqt,24);
  const ang=(a,h,dir)=>{const s=sp(h),v=dacos((-dsin(a)-dsin(s.decl)*dsin(lat))/(dcos(s.decl)*dcos(lat)))/15;return mid(h)+dir*v};
  const asr=h=>{const s=sp(h),a=-Math.atan(1/(1+dtan(Math.abs(lat-s.decl))))/R;return ang(a,h,1)};
  let o={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<3;i++){
    o={fajr:ang(fajrAng,o.fajr,-1),sunrise:ang(0.833,o.sunrise,-1),dhuhr:mid(o.dhuhr),asr:asr(o.asr),
       maghrib:ang(0.833,o.maghrib,1),isha:typeof ishaSpec==='number'?ang(ishaSpec,o.isha,1):o.isha};
    for(const k in o)o[k]=fix(o[k],24);
  }
  const adj=tz-lng/15;
  for(const k in o)o[k]=fix(o[k]+adj,24);
  if(typeof ishaSpec!=='number')o.isha=fix(o.maghrib+parseInt(ishaSpec)/60,24);
  return o}
function qiblaBearing(lat,lng){const kLat=21.4225,kLng=39.8262;
  return fix(datan2(dsin(kLng-lng),dcos(lat)*dtan(kLat)-dsin(lat)*dcos(kLng-lng)),360)}
//CALC-END

  return d.toLocaleTimeString(lang==='ar'?'ar-u-nu-latn':'en',{hour:'numeric',minute:'2-digit'})};
function todayTimes(d=new Date()){const M=METHODS[method];return prayerTimes(d,loc.lat,loc.lng,-d.getTimezoneOffset()/60,M[2],M[3])}
function nextPrayer(){const now=new Date(),h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600,tm=todayTimes(now);
  for(const k of['fajr','dhuhr','asr','maghrib','isha'])if(tm[k]>h)return{k,at:tm[k],left:tm[k]-h};
  const tmr=new Date(now.getTime()+864e5),f=todayTimes(tmr).fajr;return{k:'fajr',at:f,left:f+24-h}}
const fmtLeft=x=>{const m=Math.max(0,Math.round(x*60));return Math.floor(m/60)+':'+pad(m%60)};

      `<button class="chip ${r.days.includes(i)?'on':''}" data-act="day" data-i="${i}" style="font-family:var(--ui);font-size:14px">${d}</button>`).join('')}</div>
    <a class="btn" id="rCal" style="text-align:center;text-decoration:none" href="#">${t('addCal')}</a>
    <p class="note">${t('calNote')}</p></div>`}
function mineForm(){return `<div class="card"><label class="f" style="margin-top:0">${t('mText')}</label>
    <textarea class="in" id="mText" rows="3" dir="auto" maxlength="1500"></textarea>
    <label class="f">${t('mCount')}</label><input class="in" id="mCount" type="number" inputmode="numeric" min="1" max="10000" value="1">
    <button class="btn" data-act="addMine">${t('mAdd')}</button></div>`}
function vAzkar(){if(!sub)return `<h2>${t('sections')}</h2>${tiles()}`;
  const list=AZKAR[sub],p=prog[sub]||{};
  let h=`<button class="back" data-act="backAz">${t('back')}</button>
    <div class="seg"><button class="${azTab==='read'?'on':''}" data-act="tab" data-t="read">📖 ${t('tRead')}</button>
    <button class="${azTab==='rem'?'on':''}" data-act="tab" data-t="rem">🔔 ${t('rem')}</button></div><h2>${t(sub)}</h2>`;
  if(azTab==='rem')return h+remForm();
  if(sub==='mine')h+=mineForm();
  if(!list.length)return h+`<p class="note">${t('empty')}</p>`;
  if(azMode==='one'){pos=Math.max(0,Math.min(pos,list.length-1));const z=list[pos],c=p[pos]||0;
    h+=`<div class="card zk"><div class="tap" style="text-align:center">${pos+1} / ${list.length}${z.src?' · '+esc(z.src):''}</div>
      <div class="dua">${z.ar}</div>${lang==='en'&&z.en?`<div class="tr">${esc(z.en)}</div>`:''}</div>
    <div class="ctl"><button class="btn ghost" data-act="prev">${t('prev')}</button>
      <button class="cbtn ${c>=z.n?'ok':''}" data-act="cnt" aria-label="${t('tapCount')}"><b>${c>=z.n?'✓':z.n-c}</b></button>
      <button class="btn" data-act="nxt">${t('nextZ')}</button></div>`}
  else h+=list.map((z,i)=>{const c=p[i]||0;return `<div class="card zk ${c>=z.n?'done':''}" data-act="zk" data-i="${i}">
    ${sub==='mine'?`<button class="del" data-act="delMine" data-i="${i}" aria-label="delete">✕</button>`:''}
    <div class="dua" style="text-align:start">${z.ar}</div>${lang==='en'&&z.en?`<div class="tr" style="text-align:left">${esc(z.en)}</div>`:''}
    <div class="cnt"><span class="num">${c} / ${z.n}</span><span class="tap">${z.src?esc(z.src)+' · ':''}${t('tapCount')}</span></div></div>`}).join('');
  return h+`<button class="btn ghost" data-act="mode">${azMode==='one'?t('showAll'):t('oneByOne')}</button>
    <button class="btn ghost" data-act="resetAz">${t('reset')}</button>`}
function vTasbih(){return `<div class="chips">${PHRASES.map((p,i)=>`<button class="chip ${i===tas.i?'on':''}" data-act="ph" data-i="${i}">${p}</button>`).join('')}</div>
  <div class="dua" style="font-size:28px;margin-top:14px">${PHRASES[tas.i]}</div>
  <button class="ring" data-act="tas"><div><b id="tc">${tas.count}</b><span>${t('target')} ${tas.target}</span></div></button>
  <div class="chips" style="justify-content:center">${[33,100,1000].map(n=>`<button class="chip ${tas.target===n?'on':''}" data-act="tg" data-n="${n}" style="font-family:var(--ui)">${n}</button>`).join('')}</div>
  <div class="card"><div class="row"><span>${t('total')}</span><time>${tas.total}</time></div></div>
  <button class="btn ghost" data-act="resetTas">${t('reset')}</button>`}
function vPrayer(){const tm=todayTimes(),n=nextPrayer(),q=qiblaBearing(loc.lat,loc.lng);
  return `<h2>${t('times')}</h2><div class="card">${['fajr','sunrise','dhuhr','asr','maghrib','isha'].map(k=>
    `<div class="row ${k===n.k?'on':''}"><span>${t(k)}</span><time>${fmtTime(tm[k])}</time></div>`).join('')}</div>
  <p class="note">${t('approx')}</p>
  <h2>${t('loc')}</h2><div class="card"><button class="btn" style="margin-top:0" data-act="geo">${t('useLoc')}</button>
    <label class="f">${t('city')}</label><select class="in" id="citySel">${loc.city==null?`<option value="-1" selected>${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)}</option>`:''}
      ${CITIES.map((c,i)=>`<option value="${i}" ${loc.city===i?'selected':''}>${lang==='ar'?c[1]:c[0]}</option>`).join('')}</select>
    <label class="f">${t('method')}</label><select class="in" id="methSel">${Object.entries(METHODS).map(([k,m])=>
      `<option value="${k}" ${k===method?'selected':''}>${lang==='ar'?m[1]:m[0]}</option>`).join('')}</select>
    <p class="note" id="locMsg"></p></div>
  <h2>${t('qibla')}</h2><div class="card" style="text-align:center"><b style="font-size:34px;color:var(--green-2)">${q.toFixed(1)}°</b>
    <div class="note" style="margin-top:2px">${t('qDeg')}</div>
    <div class="compass"><i>N</i><div class="needle" id="needle" style="transform:rotate(${q-(heading||0)}deg)"></div><div class="dot"></div></div>
    <button class="btn ghost" data-act="compass">${t('compassOn')}</button><p class="note" id="cmpMsg"></p></div>`}
function vFather(){return `<div class="card father"><span class="pill">🤲 ${fatherTitle()}</span>
    <p class="note" style="text-align:center;font-size:14px">${t('hadith')}</p>
    <div class="row" style="border:0;padding-bottom:0"><span>${t('fCount')}</span><time style="font-size:24px;color:var(--gold)">${father.count}</time></div>
    <button class="btn gold" data-act="prayed">${father.last===dayKey()?t('prayedToday'):t('prayed')}</button></div>
  <h2>${t('rem')}</h2><div class="card">
    <label class="f" style="margin-top:0">${t('fName')}</label><input class="in" id="fName" maxlength="40" placeholder="${t('fNamePh')}" value="${esc(father.name)}">
    <div class="sw" style="margin-top:14px"><span>${t('remIn')}</span><input type="checkbox" id="fPrompt" ${father.prompt?'checked':''}></div>
    <label class="f">${t('freq')}</label><select class="in" id="fFreq">${[['daily','fDaily'],['friday','fFri'],['open','fOpen']].map(([v,k])=>
      `<option value="${v}" ${father.freq===v?'selected':''}>${t(k)}</option>`).join('')}</select>
    <label class="f">${t('remTime')}</label><input class="in" type="time" id="fTime" value="${esc(father.time)}">
    <a class="btn" id="calBtn" style="text-align:center;text-decoration:none" href="#">${t('addCal')}</a>
    <p class="note">${t('calNote')}</p></div>
  <h2>${t('fDuas')}</h2>${FATHER.map(d=>`<div class="card">${duaBlock(d)}</div>`).join('')}`}

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#bName').textContent=t('app');$('#langBtn').textContent=lang==='ar'?'EN':'عربي';
  $('#hDate').textContent=hijri()+' · '+greg();
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#main').innerHTML={home:vHome,azkar:vAzkar,tasbih:vTasbih,prayer:vPrayer,father:vFather}[view]();
  if(view==='father')setCalLink();
  if(view==='azkar'&&sub&&azTab==='rem')setRemLink();
}
function go(v,s=null){view=v;sub=s;render();window.scrollTo(0,0)}

/* ---------- father reminder ---------- */
function markPrayed(){father.count++;father.last=dayKey();store.set('father',father)}
function shouldPrompt(){if(!father.prompt)return false;const k=dayKey();
  if(father.freq==='open')return true;
  if(father.freq==='friday')return new Date().getDay()===5&&father.lastPrompt!==k;
  return father.lastPrompt!==k}
function showPrompt(){father.lastPrompt=dayKey();store.set('father',father);
  $('#sheet').innerHTML=`<h3>${t('mTitle')}</h3><p class="sub">${father.name?esc(father.name)+' · ':''}${t('mSub')}</p>
    ${duaBlock(FATHER[duaIdx])}<button class="btn gold" data-m="prayed">${t('prayed')}</button>
    <button class="btn ghost" data-m="later">${t('later')}</button>`;
  $('#modal').classList.add('show')}
function ics(title,body,time,days){const [h,m]=(time||'20:00').split(':').map(Number),d=new Date();
  if(!days||!days.length)days=[0,1,2,3,4,5,6];
  for(let i=0;i<7&&!days.includes(d.getDay());i++)d.setDate(d.getDate()+1);
  const st=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(h||0)+pad(m||0)+'00';
  const BY=['SU','MO','TU','WE','TH','FR','SA'];
  const rule=days.length>=7?'FREQ=DAILY':'FREQ=WEEKLY;BYDAY='+days.slice().sort().map(i=>BY[i]).join(',');
  const e=x=>x.replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sakinah//Reminder//AR','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:sakinah-'+Date.now()+'-'+Math.floor(Math.random()*1e6)+'@local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    'DTSTART:'+st,'DURATION:PT5M','RRULE:'+rule,'SUMMARY:'+e(title),'DESCRIPTION:'+e(body),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(title),'TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}
function calHref(a,txt,name){a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);a.setAttribute('download',name)}
function setCalLink(){const a=$('#calBtn');if(!a)return;
  calHref(a,ics('🤲 '+t('calTitle')+(father.name?' — '+father.name:''),FATHER[2].ar+'\n\n'+FATHER[0].ar,father.time,father.freq==='friday'?[5]:null),'father-dua.ics')}
function setRemLink(){const a=$('#rCal');if(!a)return;const r=getRem(sub),z=AZKAR[sub][0];
  const body=z?z.ar.replace(/&[a-z#0-9]+;/g,' '):'';
  calHref(a,ics('📿 '+t('itsTime')+' '+t(sub),body,r.time,r.days),'azkar-'+sub+'.ics')}

/* ---------- events ---------- */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
$('#langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';store.set('lang',lang);render()});
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');
  if(b&&b.dataset.m==='prayed')markPrayed();
  if(b||e.target.id==='modal'){$('#modal').classList.remove('show');render()}});
$('#main').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='prayed'){markPrayed();duaIdx=(duaIdx+1)%FATHER.length;render()}
  else if(a==='nextDua'){duaIdx=(duaIdx+1)%FATHER.length;render()}
  else if(a==='cat'){pos=0;azTab='read';go('azkar',el.dataset.k)}
  else if(a==='tab'){azTab=el.dataset.t;render()}
  else if(a==='mode'){azMode=azMode==='one'?'all':'one';store.set('azMode',azMode);render()}
  else if(a==='prev'){if(pos>0){pos--;render()}}
  else if(a==='nxt'){if(pos<AZKAR[sub].length-1){pos++;render()}}
  else if(a==='cnt'){const z=AZKAR[sub][pos];prog[sub]=prog[sub]||{};const c=prog[sub][pos]||0;
    if(c<z.n){prog[sub][pos]=c+1;store.set('prog',prog);render();
      if(c+1>=z.n&&pos<AZKAR[sub].length-1){const s0=sub,p0=pos;setTimeout(()=>{if(view==='azkar'&&sub===s0&&pos===p0&&azTab==='read'){pos++;render()}},450)}}
    else if(pos<AZKAR[sub].length-1){pos++;render()}}
  else if(a==='day'){const r=getRem(sub),i=+el.dataset.i;r.days=r.days.includes(i)?r.days.filter(x=>x!==i):r.days.concat(i);
    catRem[sub]=r;store.set('catRem',catRem);render()}
  else if(a==='addMine'){const tx=($('#mText').value||'').trim(),n=Math.max(1,Math.min(10000,parseInt($('#mCount').value)||1));
    if(tx){mine.push({ar:tx,n});store.set('mine',mine);syncMine();pos=mine.length-1;render()}}
  else if(a==='delMine'){mine.splice(+el.dataset.i,1);store.set('mine',mine);syncMine();prog.mine={};store.set('prog',prog);pos=0;render()}
  else if(a==='backAz')go('azkar');
  else if(a==='zk'){const i=+el.dataset.i,z=AZKAR[sub][i];prog[sub]=prog[sub]||{};const c=prog[sub][i]||0;
    if(c<z.n){prog[sub][i]=c+1;store.set('prog',prog);el.querySelector('.num').textContent=(c+1)+' / '+z.n;
      if(c+1>=z.n)el.classList.add('done')}}
  else if(a==='resetAz'){prog[sub]={};store.set('prog',prog);pos=0;render()}
  else if(a==='tas'){tas.count++;tas.total++;if(tas.count>tas.target)tas.count=1;store.set('tas',tas);$('#tc').textContent=tas.count}
  else if(a==='ph'){tas.i=+el.dataset.i;tas.count=0;store.set('tas',tas);render()}
  else if(a==='tg'){tas.target=+el.dataset.n;tas.count=0;store.set('tas',tas);render()}
  else if(a==='resetTas'){tas.count=0;tas.total=0;store.set('tas',tas);render()}
  else if(a==='geo')geo();
  else if(a==='compass')startCompass();
});
$('#main').addEventListener('change',e=>{const id=e.target.id;
  if(id==='citySel'){const i=+e.target.value;if(i>=0){loc={lat:CITIES[i][2],lng:CITIES[i][3],city:i};store.set('loc',loc);render()}}
  else if(id==='methSel'){method=e.target.value;store.set('method',method);render()}
  else if(id==='fPrompt'){father.prompt=e.target.checked;store.set('father',father)}
  else if(id==='fFreq'){father.freq=e.target.value;store.set('father',father);setCalLink()}
  else if(id==='fTime'){father.time=e.target.value||'20:00';store.set('father',father);setCalLink()}
  else if(id==='rTime'){const r=getRem(sub);r.time=e.target.value||r.time;catRem[sub]=r;store.set('catRem',catRem);setRemLink()}
  else if(id==='fName'){father.name=e.target.value.trim();store.set('father',father);render()}
});
function geo(){const msg=$('#locMsg');if(!navigator.geolocation){if(msg)msg.textContent=t('locErr');return}
  navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude,city:null};store.set('loc',loc);render()},
    ()=>{const m=$('#locMsg');if(m)m.textContent=t('locErr')},{timeout:10000,maximumAge:600000})}
function onOrient(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.absolute&&typeof e.alpha==='number')h=360-e.alpha;
  if(h==null)return;heading=h;const n=$('#needle');if(n)n.style.transform=`rotate(${qiblaBearing(loc.lat,loc.lng)-h}deg)`}
async function startCompass(){const msg=$('#cmpMsg');
  try{if(typeof DeviceOrientationEvent==='undefined')throw 0;
    if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}
    if(!compassOn){window.addEventListener('deviceorientationabsolute',onOrient,true);window.addEventListener('deviceorientation',onOrient,true);compassOn=true}
    setTimeout(()=>{if(heading==null){const m=$('#cmpMsg');if(m)m.textContent=t('compassNo')}},2500);
  }catch(e){if(msg)msg.textContent=t('compassNo')}}

/* ---------- start ---------- */
render();
if(shouldPrompt())setTimeout(showPrompt,600);
setInterval(()=>{if(prog.day!==dayKey()){prog={day:dayKey()};store.set('prog',prog)}
  if(view==='home'){const l=$('#left');if(l)l.textContent=fmtLeft(nextPrayer().left)}},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();
  if(shouldPrompt()&&!$('#modal').classList.contains('show'))showPrompt()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
